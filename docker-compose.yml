services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: gym_tracker
      MYSQL_USER: gymuser
      MYSQL_PASSWORD: gympass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:Z
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

  backend:
    build: ./backend
    volumes:
      - ./backend:/var/www/html:Z
    ports:
      - "8080:80"
    depends_on:
      - db

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:Z
    ports:
      - "80:80"

volumes:
  db_data: